name: Keep App Warm

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud frontend
        run: |
          curl -sSf --max-time 30 \
            "https://ai-pronunciation-mlops-4ejy6jjuq74jj6zecjtbnf.streamlit.app/" \
            > /dev/null

      - name: Ping Render backend
        run: |
          curl -sSf --max-time 30 \
            "https://ai-pronunciation-mlops.onrender.com/" \
            > /dev/null
